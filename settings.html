<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة النظام والبيانات | Naskly CRM</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="brand">
      <img src="logo_small.png" alt="Naskly Logo" onerror="this.style.display='none'">
      <h1>Naskly CRM</h1>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn">إدخال وبحث العملاء</a>
      <a href="dashboard.html" class="nav-btn">لوحة التحكم والشبكة</a>
      <a href="settings.html" class="nav-btn active">إدارة الفريق والخدمات</a>
    </div>
  </nav>

  <div class="container">

    <!-- Team Members Management -->
    <div class="card">
      <div class="card-title">إدارة فريق العمل (إضافة / تعديل / حذف)</div>
      
      <div style="display: flex; gap: 12px; max-width: 500px; margin-bottom: 1.5rem;">
        <input type="text" id="teamInput" class="form-control" placeholder="اسم الموظف الجديد...">
        <button id="addTeamBtn" class="btn btn-primary">إضافة موظف</button>
      </div>

      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>اسم الموظف</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="teamTbody">
            <tr>
              <td colspan="3" style="text-align: center; color: var(--text-muted); padding: 15px;">جاري التحميل...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Services Management -->
    <div class="card">
      <div class="card-title">إدارة الخدمات والباقات (إضافة / تعديل / حذف)</div>
      
      <div style="display: flex; gap: 12px; max-width: 500px; margin-bottom: 1.5rem;">
        <input type="text" id="serviceInput" class="form-control" placeholder="اسم الخدمة الجديدة...">
        <button id="addServiceBtn" class="btn btn-primary">إضافة خدمة</button>
      </div>

      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>اسم الخدمة</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="servicesTbody">
            <tr>
              <td colspan="3" style="text-align: center; color: var(--text-muted); padding: 15px;">جاري التحميل...</td>
            </tr>
          </tbody>
        </table>
      </div>
    <!-- Email Reminder Settings -->
    <div class="card">
      <div class="card-title">إعدادات إشعار الإيميل اليومي (تذكير مواعيد تسليم غداً)</div>
      
      <div class="form-grid" style="margin-bottom: 1.5rem;">
        <div class="form-group" style="grid-column: span 2;">
          <label>البريد الإلكتروني المخصص لاستلام التنبيهات</label>
          <div style="display: flex; gap: 12px;">
            <input type="email" id="reminderEmailInput" class="form-control" placeholder="nsqlycorp@gmail.com" value="nsqlycorp@gmail.com">
            <button id="saveEmailBtn" class="btn btn-primary" style="white-space: nowrap;">حفظ البريد</button>
          </div>
        </div>

        <div class="form-group">
          <label>توقيت الإرسال التلقائي اليومي (توقيت القاهرة)</label>
          <input type="text" class="form-control" value="09:00 AM (القاهرة)" readonly>
        </div>

        <div class="form-group">
          <label>حالة التذكير التلقائي اليومي</label>
          <input type="text" class="form-control" value="مفعل تلقائياً (09:00 صباحاً)" readonly style="color: #4ade80; font-weight: bold;">
        </div>
      </div>

      <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
        <button id="sendEmailNowBtn" class="btn btn-primary" style="background: var(--palette-gold); color: #000;">
          📧 إرسال إيميل التذكير الآن فوراً (HTML Mail)
        </button>
        <span id="emailStatusMsg" style="font-weight: 600; font-size: 0.9rem;"></span>
      </div>
    </div>

  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
